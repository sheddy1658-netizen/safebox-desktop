<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - SafeBox</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <div style="text-align:center;font-size:48px;margin-bottom:10px;">🔐</div>
            <h1>Forgot Password</h1>
            <p style="text-align:center;color:#6a7a8e;font-size:14px;margin-bottom:20px;">
                Answer your security question to reset your password
            </p>
            
            <!-- Step 1: Enter Username -->
            <div id="step1">
                <form id="step1Form">
                    <input type="text" id="usernameInput" placeholder="Enter your username" required>
                    <button type="submit">Continue →</button>
                </form>
                <p style="text-align:center;margin-top:12px;">
                    <a href="login.html">← Back to Login</a>
                </p>
            </div>
            
            <!-- Step 2: Security Question -->
            <div id="step2" style="display:none;">
                <p id="userDisplay" style="text-align:center;font-weight:600;color:#6C63FF;"></p>
                <div id="questionContainer" style="margin-top:16px;">
                    <p style="font-size:14px;font-weight:600;margin-bottom:8px;">Security Question:</p>
                    <p id="securityQuestionText" style="font-size:14px;background:#f8f9ff;padding:12px;border-radius:8px;margin-bottom:12px;"></p>
                    <input type="text" id="securityAnswerInput" placeholder="Your answer" style="width:100%;padding:10px;border:2px solid #e0e5f0;border-radius:8px;">
                </div>
                <button id="verifyAnswerBtn" class="btn btn-primary" style="width:100%;margin-top:12px;">Verify Answer</button>
                <p style="text-align:center;margin-top:12px;">
                    <a href="#" onclick="goBackToStep1()">← Different account</a>
                </p>
            </div>
            
            <!-- Step 3: Reset Password -->
            <div id="step3" style="display:none;">
                <p style="text-align:center;color:#28a745;font-weight:600;">✅ Security answer verified!</p>
                <p style="text-align:center;color:#6a7a8e;font-size:14px;">Enter your new password</p>
                
                <form id="resetPasswordForm">
                    <input type="password" id="newPassword" placeholder="New Password (6+ chars, letters + numbers)" required>
                    <input type="password" id="confirmNewPassword" placeholder="Confirm New Password" required>
                    <button type="submit">Reset Password</button>
                </form>
                <p style="text-align:center;margin-top:12px;">
                    <a href="login.html">← Back to Login</a>
                </p>
            </div>
            
            <div id="errorMessage" style="display:none;margin-top:12px;padding:10px;background:#ffebee;border-radius:8px;color:#dc3545;font-size:14px;"></div>
        </div>
    </div>

    <script src="js/indexeddb.js"></script>
    <script>
        let currentUserId = null;
        let currentQuestionId = null;
        
        // Step 1: Enter username
        document.getElementById('step1Form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('usernameInput').value.trim();
            
            if (!username) {
                alert('Please enter your username');
                return;
            }
            
            // Get security question
            const result = await getSecurityQuestion(username);
            
            if (!result.success) {
                document.getElementById('errorMessage').textContent = result.message;
                document.getElementById('errorMessage').style.display = 'block';
                return;
            }
            
            currentUserId = result.user_id;
            currentQuestionId = result.question_id;
            
            // Show step 2
            document.getElementById('step1').style.display = 'none';
            document.getElementById('step2').style.display = 'block';
            document.getElementById('errorMessage').style.display = 'none';
            
            document.getElementById('userDisplay').textContent = '👤 ' + username;
            document.getElementById('securityQuestionText').textContent = result.question;
            document.getElementById('securityAnswerInput').value = '';
        });
        
        // Step 2: Verify answer
        document.getElementById('verifyAnswerBtn').addEventListener('click', async function() {
            const answer = document.getElementById('securityAnswerInput').value.trim();
            
            if (!answer) {
                alert('Please enter your answer');
                return;
            }
            
            // Verify
            const result = await verifySecurityAnswer(currentUserId, answer);
            
            if (result.success) {
                // Show step 3
                document.getElementById('step2').style.display = 'none';
                document.getElementById('step3').style.display = 'block';
                document.getElementById('errorMessage').style.display = 'none';
            } else {
                document.getElementById('errorMessage').textContent = result.message;
                document.getElementById('errorMessage').style.display = 'block';
                document.getElementById('securityAnswerInput').value = '';
                document.getElementById('securityAnswerInput').focus();
            }
        });
        
        // Enter key support for answer
        document.getElementById('securityAnswerInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('verifyAnswerBtn').click();
            }
        });
        
        // Step 3: Reset password
        document.getElementById('resetPasswordForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmNewPassword').value;
            
            if (newPassword !== confirmPassword) {
                alert('❌ Passwords do not match');
                return;
            }
            
            // Validate password
            const validation = validatePassword(newPassword);
            if (!validation.valid) {
                alert('❌ ' + validation.errors.join('\n'));
                return;
            }
            
            // Reset password
            const result = await resetPasswordWithSecurity(currentUserId, newPassword);
            
            if (result.success) {
                alert('✅ ' + result.message);
                window.location.href = 'login.html';
            } else {
                alert('❌ ' + result.message);
            }
        });
        
        function goBackToStep1() {
            document.getElementById('step2').style.display = 'none';
            document.getElementById('step3').style.display = 'none';
            document.getElementById('step1').style.display = 'block';
            document.getElementById('errorMessage').style.display = 'none';
            document.getElementById('usernameInput').value = '';
        }
    </script>
</body>
</html>
